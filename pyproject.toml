[project]
name = "civicops-sentinel"
version = "0.1.0"
description = "Production-oriented multimodal urban incident intelligence platform."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13",
    "asyncpg>=0.29",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "shapely>=2.0",
    "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
